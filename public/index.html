<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdmitTalk — Coming soon</title>
<meta name="description" content="AdmitTalk is a community forum where students, parents, and counselors talk through essays, decisions, financial aid, and waitlists — together. Launching soon.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://admittalk.com/">

<meta property="og:type" content="website">
<meta property="og:url" content="https://admittalk.com/">
<meta property="og:title" content="AdmitTalk — Coming soon">
<meta property="og:description" content="A community forum where students, parents, and counselors talk through essays, decisions, financial aid, and waitlists — together.">
<meta property="og:site_name" content="AdmitTalk">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AdmitTalk — Coming soon">
<meta name="twitter:description" content="A community forum where students, parents, and counselors talk through essays, decisions, financial aid, and waitlists — together.">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #FBF4E6;
    --paper-2: #F3E7D2;
    --ink: #1F2A24;
    --ink-soft: #3D473F;
    --accent: #D9502F;
    --line: rgba(31, 42, 36, 0.16);
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #16201B;
      --paper-2: #1F2A24;
      --ink: #F3E7D2;
      --ink-soft: #C3CFC6;
      --accent: #E8663F;
      --line: rgba(243, 231, 210, 0.18);
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 24px;
  }

  main {
    flex: 1 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 64px 0;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 40px;
  }

  .logo-word {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: -0.01em;
  }

  .eyebrow {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 18px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.4rem, 7vw, 3.6rem);
    line-height: 1.08;
    letter-spacing: -0.02em;
    margin: 0 0 24px;
  }

  .underline-wrap {
    position: relative;
    display: inline-block;
    font-style: italic;
  }

  .squiggle {
    position: absolute;
    left: 0;
    bottom: -0.18em;
    width: 100%;
    height: 0.22em;
    overflow: visible;
  }

  .lede {
    font-size: 1.08rem;
    line-height: 1.65;
    color: var(--ink-soft);
    margin: 0 0 32px;
    max-width: 34em;
  }

  .contact {
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin: 0;
  }

  .contact a {
    color: var(--accent);
    font-weight: 500;
    text-underline-offset: 3px;
  }

  .contact a:hover { text-decoration: none; }

  footer {
    flex-shrink: 0;
    border-top: 1px solid var(--line);
    padding: 22px 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  footer p { margin: 0; }

  @media (max-width: 520px) {
    main { padding: 48px 0; }
    .logo { margin-bottom: 32px; }
  }
</style>
</head>
<body>

<main>
  <div class="wrap">
    <span class="logo">
      <span aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1.5" y="1.5" width="31" height="31" rx="6" transform="rotate(-4 17 17)" fill="#D9502F"/>
          <path d="M10 22.5L14.5 10.5H17.8L22.3 22.5H19.4L18.5 19.9H13.7L12.8 22.5H10ZM14.5 17.6H17.7L16.1 13L14.5 17.6Z" fill="#FBF4E6"/>
        </svg>
      </span>
      <span class="logo-word">AdmitTalk</span>
    </span>

    <p class="eyebrow">Coming soon</p>

    <h1>We're <span class="underline-wrap">building it<svg class="squiggle" viewBox="0 0 300 20" preserveAspectRatio="none" aria-hidden="true"><path d="M2 15 C 40 3, 70 3, 100 12 S 160 21, 200 10 S 260 3, 298 12" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round" style="color: var(--accent)"/></svg></span> now.</h1>

    <p class="lede">
      AdmitTalk will be a community forum where students, parents, and counselors talk
      through essays, decisions, financial aid, and waitlists — together.
    </p>

    <p class="contact">
      Questions in the meantime? <a href="mailto:hello@admittalk.com">hello@admittalk.com</a>
    </p>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>© <span id="year">2026</span> AdmitTalk</p>
  </div>
</footer>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
